<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeMatch Pro</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 100%;
        height: 100vh;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: hsl(0, 0%, 100%);
        color: hsl(222.2, 84%, 4.9%);
        overflow-x: hidden;
      }

      body.dark {
        background: hsl(222.2, 84%, 4.9%);
        color: hsl(210, 40%, 98%);
      }

      .container {
        padding: 16px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid hsl(214.3, 31.8%, 91.4%);
        flex-shrink: 0;
      }

      body.dark .header { border-bottom-color: hsl(217.2, 32.6%, 17.5%); }

      .header h1 {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, hsl(262, 80%, 50%) 0%, hsl(218, 92%, 50%) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      #resume-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 99px;
        white-space: nowrap;
      }

      #resume-chip.loaded  { background: #d1fae5; color: #065f46; }
      #resume-chip.missing { background: #fef3c7; color: #92400e; }

      body.dark #resume-chip.loaded  { background: #064e3b; color: #6ee7b7; }
      body.dark #resume-chip.missing { background: #451a03; color: #fcd34d; }

      /* ── Content ── */
      .content {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-bottom: 8px;
      }

      .card {
        background: hsl(0, 0%, 100%);
        border: 1px solid hsl(214.3, 31.8%, 91.4%);
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        flex-shrink: 0;
      }

      body.dark .card {
        background: hsl(217.2, 32.6%, 17.5%);
        border-color: hsl(217.2, 32.6%, 17.5%);
      }

      /* ── Status bar ── */
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        background: hsl(210, 40%, 96.1%);
        border-radius: 6px;
        font-size: 12px;
        flex-shrink: 0;
      }

      body.dark .status { background: hsl(217.2, 32.6%, 17.5%); }

      .status-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
      .status-text { flex: 1; }
      .status-text strong { display: block; margin-bottom: 2px; }

      /* ── Buttons ── */
      .button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .button-primary {
        background: linear-gradient(135deg, hsl(262, 80%, 50%) 0%, hsl(218, 92%, 50%) 100%);
        color: white;
      }

      .button-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,51,153,0.3); }
      .button-primary:disabled { opacity: 0.5; cursor: not-allowed; }

      .button-secondary {
        background: hsl(210, 40%, 96.1%);
        color: hsl(222.2, 84%, 4.9%);
        border: 1px solid hsl(214.3, 31.8%, 91.4%);
      }

      body.dark .button-secondary { background: hsl(217.2,32.6%,17.5%); color: hsl(210,40%,98%); border-color: hsl(217.2,32.6%,17.5%); }
      .button-secondary:hover:not(:disabled) { background: hsl(210,40%,92%); }
      body.dark .button-secondary:hover:not(:disabled) { background: hsl(217.2,32.6%,22%); }
      .button-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Job field ── */
      .job-field { margin-bottom: 8px; font-size: 12px; }
      .job-field strong { color: hsl(215.4,16.3%,46.9%); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 2px; }
      .job-field span { font-weight: 600; font-size: 13px; }

      /* ── Stats row ── */
      .stats-row { display: flex; gap: 8px; margin-bottom: 10px; }

      .stat-box { flex: 1; text-align: center; padding: 8px 4px; background: hsl(210,40%,97%); border-radius: 8px; border: 1px solid hsl(214.3,31.8%,91.4%); }
      body.dark .stat-box { background: hsl(217.2,32.6%,14%); border-color: hsl(217.2,32.6%,22%); }

      .stat-num { font-size: 20px; font-weight: 800; line-height: 1; margin-bottom: 3px; }
      .stat-num.green { color: #10b981; }
      .stat-num.blue  { color: #6366f1; }
      .stat-num.amber { color: #f59e0b; }

      .stat-label { font-size: 10px; color: hsl(215.4,16.3%,46.9%); font-weight: 500; line-height: 1.2; }

      /* ── Keyword match bar ── */
      .bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
      .bar-track { width: 100%; height: 8px; background: hsl(214.3,31.8%,91.4%); border-radius: 99px; overflow: hidden; }
      body.dark .bar-track { background: hsl(217.2,32.6%,22%); }
      .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, hsl(262,80%,50%), hsl(218,92%,50%)); transition: width 0.6s ease; }
      .bar-pct { font-size: 12px; font-weight: 700; color: hsl(262,80%,50%); }

      /* ── Chips ── */
      .chips-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: hsl(215.4,16.3%,46.9%); margin-bottom: 6px; }
      .chips-section { margin-top: 4px; }
      .chips-wrap { display: flex; flex-wrap: wrap; gap: 4px; }

      .chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; line-height: 1.6; }
      .chip-green { background: #d1fae5; color: #065f46; }
      .chip-red   { background: #fee2e2; color: #991b1b; }

      body.dark .chip-green { background: #064e3b; color: #6ee7b7; }
      body.dark .chip-red   { background: #450a0a; color: #fca5a5; }

      /* ── Improvements list ── */
      .improvements-list { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
      .improvements-list li { font-size: 12px; color: hsl(222.2,47%,20%); padding-left: 14px; position: relative; line-height: 1.4; }
      body.dark .improvements-list li { color: hsl(210,40%,80%); }
      .improvements-list li::before { content: "→"; position: absolute; left: 0; color: hsl(262,80%,50%); font-weight: 700; font-size: 10px; top: 1px; }

      /* ── Source card ── */
      .source-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
      .source-domain { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: hsl(222.2,47%,25%); background: hsl(210,40%,96%); padding: 4px 10px; border-radius: 99px; border: 1px solid hsl(214.3,31.8%,88%); min-width: 0; overflow: hidden; }
      .source-domain span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      body.dark .source-domain { color: hsl(210,40%,80%); background: hsl(217.2,32.6%,17%); border-color: hsl(217.2,32.6%,25%); }
      .open-job-link { font-size: 12px; font-weight: 600; color: hsl(262,80%,50%); text-decoration: none; padding: 4px 10px; border-radius: 99px; border: 1px solid hsl(262,80%,80%); background: hsl(262,80%,97%); transition: background .15s; white-space: nowrap; flex-shrink: 0; }
      .open-job-link:hover { background: hsl(262,80%,92%); }
      body.dark .open-job-link { background: hsl(262,40%,20%); border-color: hsl(262,50%,40%); color: hsl(262,80%,75%); }

      /* ── Divider ── */
      .divider { height: 1px; background: hsl(214.3,31.8%,91.4%); margin: 8px 0; }
      body.dark .divider { background: hsl(217.2,32.6%,22%); }

      /* ── Loading shimmer ── */
      @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
      .loading { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .skel { border-radius: 6px; height: 12px; background: linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
      body.dark .skel { background: linear-gradient(90deg,#1e293b 25%,#334155 50%,#1e293b 75%); background-size: 200% 100%; }

      /* ── Alerts ── */
      .error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
      .success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
      body.dark .error   { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
      body.dark .success { background: #064e3b; color: #6ee7b7; border-color: #065f46; }

      /* ── Footer ── */
      .footer { padding-top: 10px; border-top: 1px solid hsl(214.3,31.8%,91.4%); font-size: 11px; text-align: center; color: hsl(215.4,16.3%,46.9%); flex-shrink: 0; }
      body.dark .footer { border-top-color: hsl(217.2,32.6%,17.5%); }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📄 ResumeMatch Pro</h1>
        <span id="resume-chip" class="missing">⚠ No resume</span>
      </div>

      <div class="content">
        <div id="main-content">
          <!-- dynamic content injected by sidebar.ts -->
        </div>
      </div>

      <div class="footer">
        <p>
          💡 Tip: Upload your master resume on
          <a href="#" id="dashboard-link" style="color:hsl(262,80%,50%);text-decoration:underline;font-weight:600">
            the website
          </a>
        </p>
      </div>
    </div>

    <script src="sidebar.js" type="module"></script>
  </body>
</html>
